# Netlify: reine statische Seite, es wird nichts gebaut.
[build]
  publish = "."
  command = ""

# Skripte und Styles der Bestellfunktion nur kurz zwischenspeichern, damit Änderungen schnell ankommen
[[headers]]
  for = "/bestellung/*"
  [headers.values]
    Cache-Control = "public, max-age=300"

# Schutz für alle Seiten: nicht in fremde Seiten einbettbar, keine Typ-Raterei, sparsamer Referrer, nur HTTPS
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "frame-ancestors 'none'; object-src 'none'; base-uri 'self'"

# Theke und Einstellungen gehören nicht in Suchmaschinen
[[headers]]
  for = "/theke.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
[[headers]]
  for = "/verwaltung.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
