<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Theke – NANNI</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#33261f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%239aae93'/%3E%3Ctext x='32' y='41' font-family='sans-serif' font-size='26' text-anchor='middle' fill='%23fbf7f1'%3EN%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="bestellung/theke.css">
</head>
<body>

<!-- Tor: erst Schlüssel, dann einmal "Starten" tippen (ohne Tipp darf der Browser keinen Ton abspielen) -->
<div class="tor" id="tor">
  <form id="tor-form">
    <h1>NANNI <small>Theke</small></h1>
    <p id="tor-text">Hier kommen die Bestellungen von den Tischen an.</p>
    <label id="tor-feld" hidden>Theken-Schlüssel
      <input id="tor-key" type="password" autocomplete="off" autocapitalize="off" spellcheck="false">
    </label>
    <p class="tor-fehler" id="tor-fehler" role="alert" hidden></p>
    <button type="submit" id="tor-knopf">Starten</button>
  </form>
</div>

<header class="kopf">
  <h1>NANNI <small>Theke</small></h1>
  <span class="netz" id="netz"><i></i><span>Verbunden</span></span>
  <button class="tontest" id="ton-test" type="button">Ton testen</button>
  <button class="schalter" id="schalter" type="button" role="switch" aria-checked="true"><span class="knubbel"></span><span id="schalter-text">Bestellen am Handy ist an</span></button>
</header>
<button class="meldung" id="meldung" type="button" aria-live="assertive" hidden></button>
<p class="band rot" id="band-netz" hidden>Keine Verbindung. Neue Bestellungen kommen gerade nicht an. Prüft das WLAN.</p>
<p class="band gelb" id="band-pause" hidden>Bestellen am Handy ist pausiert. Gäste sehen den Hinweis, an der Theke zu bestellen.</p>

<section class="tische" id="tische" hidden>
  <h2>Offene Tische</h2>
  <div class="tische-liste" id="tische-liste"></div>
</section>
<dialog class="rechnung" id="rechnung"></dialog>

<main class="brett">
  <section class="spalte" id="spalte-neu"><header><h2>Neu</h2><span>0</span></header><div class="karten"></div></section>
  <section class="spalte" id="spalte-arbeit"><header><h2>In Arbeit</h2><span>0</span></header><div class="karten"></div></section>
  <section class="spalte" id="spalte-fertig"><header><h2>Erledigt</h2><span>0</span></header><div class="karten"></div></section>
</main>

<script src="bestellung/config.js"></script>
<script src="bestellung/theke.js"></script>
</body>
</html>
